</head>
<body>
<script>
(function () {
  var LOGO = '[class*="logo" i], [id*="logo" i], [class*="brand" i], [id*="brand" i], [class*="strawberry" i], [id*="strawberry" i], header svg, header img, nav svg, nav img';
  document.addEventListener('click', function (e) {
    if (!e.target.closest || !e.target.closest(LOGO)) return;
    var now = Date.now(), d = {};
    try { d = JSON.parse(sessionStorage.getItem('strawbzTaps')) || {}; } catch (_) {}
    var n = (now - (d.t || 0) < 2500) ? (d.n || 0) + 1 : 1;
    try { sessionStorage.setItem('strawbzTaps', JSON.stringify({ n: n, t: now })); } catch (_) {}
    if (n >= 5) {
      e.preventDefault();
      try { sessionStorage.removeItem('strawbzTaps'); sessionStorage.setItem('strawbzUnlocked', '1'); } catch (_) {}
      location.href = 'jetty-strawbz.html';
    }
  }, true);
})();
</script>

</body>
