<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>HaiStrawberry</title>
  <meta name="description" content="HaiStrawberry: my corner for music, nature, and CLS study flashcards.">
  <meta name="theme-color" content="#C93F80">
  <meta property="og:title" content="HaiStrawberry">
  <meta property="og:description" content="Music, nature, and CLS study flashcards.">
  <meta property="og:type" content="website">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* lets quick taps on the record register on phones instead of zooming or selecting text */
    .record, .brand { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>
  <!-- I Love Ocavil -->
  <div id="app"></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript><p style="padding:24px">Turn on JavaScript to see this site.</p></noscript>
  <script src="card-images.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="brain-break.js"></script>

  <!-- Secret: tap the strawberry record (or the HaiStrawberry name) 5 times to open Jetty Strawbz -->
  <script>
  (function () {
    var SECRET_SPOTS = '.record, .brand';
    document.addEventListener('click', function (e) {
      if (!e.target || !e.target.closest || !e.target.closest(SECRET_SPOTS)) return;
      var now = Date.now(), d = {};
      try { d = JSON.parse(sessionStorage.getItem('strawbzTaps')) || {}; } catch (_) {}
      var n = (now - (d.t || 0) < 2500) ? (d.n || 0) + 1 : 1;
      try { sessionStorage.setItem('strawbzTaps', JSON.stringify({ n: n, t: now })); } catch (_) {}
      if (n >= 5) {
        e.preventDefault();
        try { sessionStorage.removeItem('strawbzTaps'); sessionStorage.setItem('strawbzUnlocked', '1'); } catch (_) {}
        location.href = 'jetty-strawbz.html';
      }
    }, true);
  })();
  </script>
</body>
</html>
