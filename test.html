<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Create a Test · HaiStrawberry</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#C93F80">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Test mode: a quiet page. Uses the colors and fonts from styles.css, none of the decoration. */
    body{background:var(--bg);padding-inline:16px;min-height:100vh}
    .t-wrap{max-width:720px;margin-inline:auto;padding-block:20px 120px}
    .t-top{display:flex;align-items:center;gap:12px;justify-content:space-between;min-height:40px}
    .t-link{background:none;border:0;padding:6px 0;color:var(--muted);font-weight:600;text-decoration:none;font-size:.95rem}
    .t-link:hover{color:var(--ink)}
    .t-head{margin:18px 0 22px}
    .t-head h1{font-size:clamp(2rem,6vw,2.8rem)}
    .t-head p{color:var(--muted);margin-top:8px}

    /* setup */
    .t-group{border:1px solid var(--line);background:var(--surface);border-radius:14px;margin-bottom:12px;overflow:hidden}
    .t-ghead{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
    .t-ghead label{display:flex;align-items:center;gap:12px;flex:1;cursor:pointer;font-family:var(--display);font-size:1.1rem;line-height:1.2}
    .t-gmeta{font-family:var(--mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
    .t-decks{list-style:none;margin:0;padding:4px 0}
    .t-deck label{display:flex;align-items:center;gap:12px;padding:9px 14px;cursor:pointer}
    .t-deck label:hover{background:var(--surface-2)}
    .t-deck .nm{flex:1;min-width:0}
    .t-deck .cd{font-family:var(--mono);font-size:.7rem;color:var(--muted);letter-spacing:.06em;margin-right:6px}
    .t-deck .ct{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
    input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
    .t-bulk{display:flex;gap:16px;margin:-8px 0 14px}
    .t-len{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 8px}
    .t-len button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600}
    .t-len button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
    .t-lbl{font-family:var(--mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:26px}
    .t-bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:3}
    .t-bar-in{max-width:720px;margin-inline:auto;display:flex;align-items:center;gap:12px;justify-content:space-between}
    .t-bar-in span{color:var(--muted);font-size:.92rem}
    .btn[disabled]{opacity:.45;cursor:not-allowed}
    .btn.alt{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}

    /* question: a still frame (top bar + bottom bar never move); only the middle fades between questions */
    body.t-taking{padding-bottom:0}
    .t-qtop{position:sticky;top:0;z-index:3;background:var(--bg);margin-inline:-16px;padding:10px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
    .t-exit{flex:none;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;font:600 20px/1 var(--body);color:var(--muted);padding:0}
    .t-exit:hover{color:var(--ink);border-color:var(--muted)}
    .t-prog{flex:1;display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:.78rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;min-width:0}
    .t-prog b{font-weight:600;color:var(--ink);white-space:nowrap;min-width:5.5ch}
    .t-track{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
    .t-track span{display:block;height:100%;background:var(--accent);transition:width .3s ease}
    .t-stage{padding:20px 0 130px;transition:opacity .16s ease,transform .16s ease}
    .t-stage.out{opacity:0;transform:translateY(6px)}
    .t-pic{height:min(32vh,280px);display:grid;place-items:center;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);margin-bottom:16px;overflow:hidden}
    .t-pic img{max-width:100%;max-height:100%;object-fit:contain;display:block}
    .t-qtext{font-size:1.22rem;line-height:1.4;overflow-wrap:anywhere;margin-bottom:18px;min-height:1.4em}
    .t-stage .choice{transition:border-color .12s,background-color .12s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    .t-stage .choice:focus{outline:none}
    .t-stage .choice:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    /* phones have no real hover: stop the "faint purple" sticking to whatever answer is under your finger */
    @media (hover:none){.t-stage .choice:hover:not(.sel){border-color:var(--line)}}
    .choice.sel,.choice.sel:hover{border-color:var(--violet);background:var(--violet-soft)}
    .choice.sel .key{background:var(--violet);color:var(--surface)}
    .t-qbar .btn{min-width:120px;justify-content:center}
    .t-hint{color:var(--muted);font-size:.85rem;margin-top:14px;text-align:center}
    @media (hover:none){.t-hint{display:none}}

    /* exit confirmation */
    .t-modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:rgba(16,24,23,.45);animation:t-fade .15s ease both}
    .t-modal[hidden]{display:none}
    .t-dialog{width:min(380px,100%);background:var(--surface);border-radius:18px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:t-pop .18s ease both}
    .t-dialog h2{font-size:1.5rem;margin-bottom:8px}
    .t-dialog p{color:var(--muted)}
    .t-dialog .t-dacts{display:flex;flex-direction:column;gap:10px;margin-top:20px}
    .t-dialog .btn{justify-content:center}
    .t-dialog .t-link{text-align:center}
    @keyframes t-fade{from{opacity:0}}
    @keyframes t-pop{from{opacity:0;transform:scale(.96)}}
    @media (prefers-reduced-motion:reduce){.t-stage,.t-modal,.t-dialog{transition:none;animation:none}}

    /* results */
    .t-score{text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:28px 20px}
    .t-score .big{font-family:var(--display);font-size:clamp(3rem,12vw,4.6rem);line-height:1}
    .t-score .big small{font-size:.45em;color:var(--muted)}
    .t-score .pct{font-family:var(--mono);color:var(--accent);margin-top:6px;letter-spacing:.06em}
    .t-score p.msg{margin-top:12px;color:var(--muted)}
    .t-acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0 6px}
    .t-break{width:100%;border-collapse:collapse;margin-top:10px;font-size:.95rem}
    .t-break td{padding:8px 4px;border-bottom:1px solid var(--line)}
    .t-break td:last-child{text-align:right;font-family:var(--mono);white-space:nowrap}
    .t-break .cd{font-family:var(--mono);font-size:.7rem;color:var(--muted);margin-right:6px}
    h2.t-h2{margin:34px 0 12px;font-size:1.5rem}
    .t-miss{list-style:none;padding:0;margin:0;display:grid;gap:12px}
    .t-miss li{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px}
    .t-miss img{display:block;max-width:100%;max-height:260px;border-radius:10px;margin-bottom:10px;background:var(--surface-2)}
    .t-miss .q{font-size:1.05rem;margin-bottom:12px}
    .t-miss .yours,.t-miss .right{border-radius:10px;padding:10px 12px;margin-top:8px}
    .t-miss .yours{background:var(--accent-soft)}
    .t-miss .right{background:var(--teal-soft)}
    .t-miss .tag{display:block;font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
    .t-miss .right img{margin:10px 0 0}
    .t-from{font-family:var(--mono);font-size:.68rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
    .t-empty{color:var(--muted);text-align:center;padding:30px 0}
  </style>
</head>
<body>
  <div id="test" class="t-wrap"></div>
  <noscript><p style="padding:24px">Turn on JavaScript to use test mode.</p></noscript>
  <script src="card-images.js"></script>
  <script src="data.js"></script>
  <script src="test.js"></script>
</body>
</html>
