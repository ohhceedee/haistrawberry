<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Jetty Strawbz</title>

<script>
/* ---------------------------------------------------------------
   SECRET DOOR
   On the live site this page only opens if the visitor got here by
   tapping the strawberry logo 5 times (the logo script sets the flag
   below). Anywhere else (your computer, a preview) it opens freely
   so you can test it.
---------------------------------------------------------------- */
var HOME_URL = '/';
var SECRET_FLAG = 'strawbzUnlocked';
var GATED_HOSTS = ['haistrawberry.com', 'www.haistrawberry.com'];
(function () {
  if (GATED_HOSTS.indexOf(location.hostname) === -1) return;
  var ok = false;
  try { ok = sessionStorage.getItem(SECRET_FLAG) === '1'; } catch (e) {}
  if (!ok) location.replace(HOME_URL);
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
  :root {
    --ink: #1d0b2e;
    --cream: #fff3d6;
    --hot: #ff2e63;
    --pink: #ff8fb8;
    --purple: #7b4dff;
    --teal: #22d3c5;
    --u: 3px; /* one game pixel, set by script */
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    background: var(--ink);
    font-family: "Press Start 2P", "Courier New", monospace;
    color: var(--cream);
    overflow: hidden;
  }

  .stage {
    position: relative;
    width: min(100vw, calc(100vh * 9 / 16));
    width: min(100vw, calc(100dvh * 9 / 16));
    aspect-ratio: 9 / 16;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
  }

  /* ---------- heads-up display ---------- */
  .hud {
    position: absolute;
    top: calc(var(--u) * 12);
    left: 0; right: 0;
    text-align: center;
    font-size: calc(var(--u) * 14);
    text-shadow: calc(var(--u) * 1) calc(var(--u) * 1) 0 var(--ink),
                 calc(var(--u) * 2) calc(var(--u) * 2) 0 var(--purple);
    pointer-events: none;
  }
  .sound {
    position: absolute;
    top: calc(var(--u) * 4);
    right: calc(var(--u) * 4);
    font: inherit;
    font-size: calc(var(--u) * 5);
    color: var(--cream);
    background: var(--ink);
    border: calc(var(--u) * 1) solid var(--cream);
    padding: calc(var(--u) * 2) calc(var(--u) * 3);
    cursor: pointer;
  }

  /* ---------- title screen ---------- */
  .title { position: absolute; inset: 0; text-align: center; }
  .title h1 {
    position: absolute;
    top: calc(var(--u) * 26);
    left: 0; right: 0;
    margin: 0;
    font-size: calc(var(--u) * 14);
    font-weight: normal;
    line-height: 1.35;
    text-shadow: calc(var(--u) * 1) calc(var(--u) * 1) 0 var(--ink),
                 calc(var(--u) * 2) calc(var(--u) * 2) 0 var(--purple);
  }
  .title h1 span { display: block; }
  .title h1 .l1 { color: var(--teal); }
  .title h1 .l2 { color: var(--hot); }
  .title .go {
    position: absolute;
    top: calc(var(--u) * 140);
    left: 0; right: 0;
    margin: 0;
    font-size: calc(var(--u) * 6);
    text-shadow: calc(var(--u) * 1) calc(var(--u) * 1) 0 var(--ink);
    animation: blink 1s steps(1) infinite;
  }
  .title .board {
    position: absolute;
    top: calc(var(--u) * 158);
    left: 50%;
    transform: translateX(-50%);
    width: calc(var(--u) * 96);
    background: rgba(29, 11, 46, 0.78);
    padding: calc(var(--u) * 4) calc(var(--u) * 6);
  }
  .title .back {
    position: absolute;
    bottom: calc(var(--u) * 7);
    left: 0; right: 0;
    font-size: calc(var(--u) * 5);
    color: var(--cream);
    text-decoration: none;
  }
  .title .back span { border-bottom: calc(var(--u) * 1) solid var(--teal); }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- score board ---------- */
  .board {
    list-style: none;
    margin: 0;
    padding: 0;
    font-size: calc(var(--u) * 6);
    line-height: 1.7;
  }
  .board li { display: flex; justify-content: space-between; gap: calc(var(--u) * 4); }
  .board li .rank { color: var(--pink); width: 2.2em; text-align: left; }
  .board li .name { flex: 1; text-align: left; }
  .board li.me { color: var(--teal); }
  .board li.me .rank { color: var(--teal); }
  .board li.empty { justify-content: center; color: var(--pink); }

  /* ---------- game over ---------- */
  .over {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: calc(var(--u) * 124);
    padding: calc(var(--u) * 8);
    text-align: center;
    background: rgba(29, 11, 46, 0.94);
    border: calc(var(--u) * 2) solid var(--cream);
    box-shadow: 0 0 0 calc(var(--u) * 2) var(--ink);
    cursor: default;
  }
  .over h2 {
    margin: 0 0 calc(var(--u) * 6);
    font-size: calc(var(--u) * 10);
    font-weight: normal;
    color: var(--hot);
    text-shadow: calc(var(--u) * 1) calc(var(--u) * 1) 0 var(--purple);
  }
  .over .final { margin: 0 0 calc(var(--u) * 7); font-size: calc(var(--u) * 7); }
  .over .final b { font-weight: normal; color: var(--teal); }
  .over form { margin: 0 0 calc(var(--u) * 4); }
  .over label {
    display: block;
    font-size: calc(var(--u) * 5);
    line-height: 1.7;
    color: var(--pink);
    margin-bottom: calc(var(--u) * 5);
  }
  .over input {
    display: block;
    width: calc(var(--u) * 62);
    margin: 0 auto calc(var(--u) * 6);
    padding: calc(var(--u) * 4) 0 calc(var(--u) * 3) calc(var(--u) * 3);
    font: inherit;
    font-size: calc(var(--u) * 12);
    letter-spacing: calc(var(--u) * 3);
    text-align: center;
    text-transform: uppercase;
    color: var(--cream);
    background: var(--ink);
    border: calc(var(--u) * 2) solid var(--teal);
    border-radius: 0;
    outline: none;
  }
  .over input:focus { border-color: var(--pink); }
  .over .board { margin-bottom: calc(var(--u) * 7); }
  .over .note { margin: 0 0 calc(var(--u) * 6); font-size: calc(var(--u) * 4); line-height: 1.7; color: var(--pink); }
  .btn {
    font: inherit;
    font-size: calc(var(--u) * 6);
    color: var(--ink);
    background: var(--teal);
    border: 0;
    border-radius: 0;
    padding: calc(var(--u) * 5) calc(var(--u) * 7) calc(var(--u) * 4);
    box-shadow: calc(var(--u) * 2) calc(var(--u) * 2) 0 var(--purple);
    cursor: pointer;
  }
  .btn:active { transform: translate(calc(var(--u) * 1), calc(var(--u) * 1)); box-shadow: calc(var(--u) * 1) calc(var(--u) * 1) 0 var(--purple); }
  .btn:focus-visible, .sound:focus-visible, .back:focus-visible { outline: calc(var(--u) * 1) solid var(--cream); outline-offset: calc(var(--u) * 1); }

  @media (prefers-reduced-motion: reduce) {
    .title .go { animation: none; }
  }
</style>
</head>
<body>

<main class="stage" id="stage">
  <canvas id="game" width="144" height="256" aria-label="Jetty Strawbz game"></canvas>

  <div class="hud" id="hud" hidden>0</div>
  <button class="sound" id="sound" type="button">SFX ON</button>

  <section class="title" id="title">
    <h1><span class="l1">JETTY</span><span class="l2">STRAWBZ</span></h1>
    <p class="go">TAP TO BLAST OFF</p>
    <ol class="board" id="titleBoard"></ol>
    <a class="back" id="back" href="/"><span>BACK TO SITE</span></a>
  </section>

  <section class="over" id="over" hidden>
    <h2>GAME OVER</h2>
    <p class="final">SCORE <b id="final">0</b></p>
    <form id="entry" hidden>
      <label for="initials">NEW HIGH SCORE!<br>ENTER YOUR INITIALS</label>
      <input id="initials" maxlength="3" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button class="btn" type="submit">SAVE SCORE</button>
    </form>
    <ol class="board" id="board"></ol>
    <p class="note" id="note" hidden>OFFLINE: SAVED ON THIS DEVICE ONLY</p>
    <button class="btn" id="retry" type="button">PLAY AGAIN</button>
  </section>
</main>

<script>
(function () {
  'use strict';

  /* ===============================================================
     TUNING  (change these to make the game easier or harder)
  ================================================================ */
  var GRAVITY   = 560;  // how fast she falls
  var BOOST     = -178; // jet boot kick (more negative = stronger)
  var SPEED     = 58;   // starting scroll speed
  var SPEED_MAX = 80;   // top scroll speed
  var GAP       = 66;   // opening between the pipes at the start
  var GAP_MIN   = 56;   // tightest the opening ever gets
  var SPACING   = 84;   // distance between pipes
  var BOARD_SIZE = 10;  // how many scores are kept

  /* ===============================================================
     SETUP
  ================================================================ */
  var W = 144, H = 256, GROUND = 232, PIPE_W = 24, BERRY = 16;
  var stage = document.getElementById('stage');
  var cvs = document.getElementById('game');
  var ctx = cvs.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  var hud = document.getElementById('hud');
  var titleEl = document.getElementById('title');
  var titleBoard = document.getElementById('titleBoard');
  var overEl = document.getElementById('over');
  var finalEl = document.getElementById('final');
  var entry = document.getElementById('entry');
  var initials = document.getElementById('initials');
  var boardEl = document.getElementById('board');
  var retryBtn = document.getElementById('retry');
  var noteEl = document.getElementById('note');
  var soundBtn = document.getElementById('sound');
  document.getElementById('back').href = (typeof HOME_URL === 'string') ? HOME_URL : '/';

  var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function fit() { stage.style.setProperty('--u', (stage.clientWidth / W) + 'px'); }
  if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);
  window.addEventListener('resize', fit);
  fit();

  /* ===============================================================
     SAVED DATA
     Scores are shared through a free Firebase database, so everyone
     sees one board. A copy is also kept in this browser as a backup
     for when there is no connection.
  ================================================================ */
  var Store = {
    mem: {},
    get: function (k) {
      try { var v = localStorage.getItem(k); if (v !== null) return v; } catch (e) {}
      return (k in this.mem) ? this.mem[k] : null;
    },
    set: function (k, v) {
      this.mem[k] = v;
      try { localStorage.setItem(k, v); } catch (e) {}
    }
  };

  function cleanName(s) {
    return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3);
  }

  /* ---- shared leaderboard (Firebase / Firestore) ----
     These values are safe to be public. What protects the data is the
     security rules set in the Firebase console, not hiding this block. */
  var FIREBASE = {
    projectId: 'haistrawberry-32e3f',
    apiKey: 'AIzaSyA00XAlH9hLUVUT1gU0cyl1fC9fArtEEhQ'
  };
  var FS_URL = 'https://firestore.googleapis.com/v1/projects/' + FIREBASE.projectId + '/databases/(default)/documents';
  var SCORE_CAP = 999;

  function tidy(list) {
    if (!Array.isArray(list)) list = [];
    return list
      .filter(function (e) { return e && isFinite(e.score) && e.score > 0; })
      .map(function (e) { return { name: cleanName(e.name) || 'AAA', score: Math.floor(e.score), at: Number(e.at) || 0 }; })
      .sort(function (a, b) { return b.score - a.score || a.at - b.at; })
      .slice(0, BOARD_SIZE);
  }

  function cloud(path, body) {
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 4000);
    return fetch(FS_URL + path + '?key=' + encodeURIComponent(FIREBASE.apiKey), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (res) {
      clearTimeout(timer);
      if (!res.ok) throw new Error('Firestore ' + res.status);
      return res.json();
    }, function (err) { clearTimeout(timer); throw err; });
  }

  var Scores = {
    KEY: 'jettyStrawbz.scores.v1',
    local: function () {
      var list = [];
      try { list = JSON.parse(Store.get(this.KEY) || '[]'); } catch (e) {}
      return tidy(list);
    },
    // top scores from the shared board; falls back to this device's copy if offline
    load: async function () {
      try {
        var rows = await cloud(':runQuery', {
          structuredQuery: {
            from: [{ collectionId: 'scores' }],
            orderBy: [{ field: { fieldPath: 'score' }, direction: 'DESCENDING' }],
            limit: BOARD_SIZE
          }
        });
        var list = tidy((rows || []).filter(function (r) { return r && r.document; }).map(function (r) {
          var f = r.document.fields || {};
          return {
            name: f.name && f.name.stringValue,
            score: Number(f.score && f.score.integerValue),
            at: Number(f.at && f.at.integerValue)
          };
        }));
        Store.set(this.KEY, JSON.stringify(list));
        return list;
      } catch (e) {
        if (window.console) console.warn('Jetty Strawbz: could not reach the shared board, showing this device\'s copy.', e);
        return this.local();
      }
    },
    add: async function (name, score) {
      var rec = { name: cleanName(name) || 'AAA', score: Math.min(SCORE_CAP, Math.floor(score)), at: Date.now() };
      var saved = true, list;
      try {
        await cloud('/scores', {
          fields: {
            name: { stringValue: rec.name },
            score: { integerValue: String(rec.score) },
            at: { integerValue: String(rec.at) }
          }
        });
        list = await this.load();
      } catch (e) {
        saved = false;
        if (window.console) console.warn('Jetty Strawbz: score was not saved to the shared board.', e);
        list = this.local();
      }
      if (!list.some(function (x) { return x.at === rec.at; })) list = tidy(list.concat([rec]));
      Store.set(this.KEY, JSON.stringify(list));
      return { list: list, at: rec.at, saved: saved };
    }
  };

  function renderBoard(el, list, limit, highlightAt) {
    el.textContent = '';
    if (!list.length) {
      var none = document.createElement('li');
      none.className = 'empty';
      none.textContent = 'NO SCORES YET';
      el.appendChild(none);
      return;
    }
    list.slice(0, limit).forEach(function (e, i) {
      var li = document.createElement('li');
      if (highlightAt && e.at === highlightAt) li.className = 'me';
      var r = document.createElement('span'); r.className = 'rank'; r.textContent = (i + 1) + '.';
      var n = document.createElement('span'); n.className = 'name'; n.textContent = e.name;
      var s = document.createElement('span'); s.textContent = String(e.score);
      li.appendChild(r); li.appendChild(n); li.appendChild(s);
      el.appendChild(li);
    });
  }

  /* ===============================================================
     SOUND  (tiny square-wave bleeps, no audio files needed)
  ================================================================ */
  var actx = null;
  var muted = Store.get('jettyStrawbz.muted') === '1';
  function paintSound() { soundBtn.textContent = muted ? 'SFX OFF' : 'SFX ON'; }
  paintSound();
  soundBtn.addEventListener('click', function () {
    muted = !muted;
    Store.set('jettyStrawbz.muted', muted ? '1' : '0');
    paintSound();
    soundBtn.blur();
  });

  function beep(freq, dur, type, vol, slideTo, delay) {
    if (muted) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!actx) actx = new AC();
      if (actx.state === 'suspended') actx.resume();
      var t0 = actx.currentTime + (delay || 0);
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      g.gain.setValueAtTime(vol || 0.04, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) {}
  }
  var sfx = {
    boost: function () { beep(300, 0.10, 'square', 0.035, 620); },
    point: function () { beep(880, 0.07, 'square', 0.04); beep(1320, 0.10, 'square', 0.04, 0, 0.07); },
    crash: function () { beep(220, 0.32, 'sawtooth', 0.06, 50); },
    save:  function () { beep(660, 0.08, 'square', 0.04); beep(880, 0.08, 'square', 0.04, 0, 0.08); beep(1320, 0.16, 'square', 0.04, 0, 0.16); }
  };

  /* ===============================================================
     PIXEL ART
  ================================================================ */
  var PAL = {
    k: '#1d0b2e', // outline
    g: '#2fd67b', // leaf
    r: '#ff2e63', // berry
    R: '#b3124a', // berry shade
    p: '#ff9bb8', // shine
    s: '#ffe9a8', // seed
    w: '#ffffff', // eye
    b: '#9a7bff', // boot
    B: '#5a35d6'  // boot shade
  };
  var BERRY_ART = [
    '.....g..g..g....',
    '......gggggg....',
    '....kgggggggk...',
    '...krrgggggrrk..',
    '..krprrrgrrrrrk.',
    '..krrsrrrrsrrrk.',
    '..krrrrwkrrwkrk.',
    '..krsrrwkrrwkrk.',
    '..kRrrrrrrrrrrk.',
    '...kRrsrrrrsrk..',
    '...kRRrrrrrrrk..',
    '....kRRrrrrrk...',
    '.....kRRrrrk....',
    '....bbbk.kbbb...',
    '....bBBb.bBBb...',
    '....BBBB.BBBB...'
  ];
  function makeSprite(rows) {
    var c = document.createElement('canvas');
    c.width = rows[0].length; c.height = rows.length;
    var x = c.getContext('2d');
    rows.forEach(function (row, y) {
      for (var i = 0; i < row.length; i++) {
        var col = PAL[row[i]];
        if (col) { x.fillStyle = col; x.fillRect(i, y, 1, 1); }
      }
    });
    return c;
  }
  var sprite = makeSprite(BERRY_ART);

  // small repeatable random so the sky looks the same every visit
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // sky, painted once
  var sky = document.createElement('canvas');
  sky.width = W; sky.height = H;
  (function () {
    var x = sky.getContext('2d');
    var bands = ['#231046', '#2e1458', '#3d1a6e', '#532182', '#6f2a93', '#8f349f', '#b443a6', '#d655a8', '#f06fae', '#ff8fb8'];
    var bh = GROUND / bands.length;
    bands.forEach(function (c, i) {
      x.fillStyle = c;
      x.fillRect(0, Math.floor(i * bh), W, Math.ceil(bh) + 1);
    });
    // checkerboard seam between bands for that dithered look
    for (var i = 1; i < bands.length; i++) {
      x.fillStyle = bands[i];
      var y = Math.floor(i * bh) - 1;
      for (var px = (i % 2); px < W; px += 2) x.fillRect(px, y, 1, 1);
    }
  })();

  var rand = rng(8);
  var stars = [];
  for (var i = 0; i < 42; i++) {
    stars.push({ x: Math.floor(rand() * W), y: Math.floor(rand() * 112), sp: 1 + rand() * 3, ph: rand() * 6, c: rand() > 0.7 ? '#8ff5ea' : '#fff3d6' });
  }
  var clouds = [
    { x: 20, y: 46, w: 22 }, { x: 96, y: 78, w: 16 }, { x: 150, y: 30, w: 26 }
  ];

  /* ===============================================================
     GAME STATE
  ================================================================ */
  var state = 'title'; // title | play | dying | over
  var berry = { x: 34, y: 104, vy: 0, flame: 0 };
  var pipes = [], particles = [];
  var score = 0, toNextPipe = 0;
  var clock = 0, scroll = 0, shake = 0, flash = 0, overAt = 0;

  function speedNow() { return Math.min(SPEED_MAX, SPEED + score * 0.8); }
  function gapNow() { return Math.max(GAP_MIN, GAP - Math.floor(score / 5)); }

  function start() {
    berry.y = 104; berry.vy = 0; berry.flame = 0;
    pipes = []; particles = [];
    score = 0; toNextPipe = 70; shake = 0; flash = 0;
    hud.textContent = '0';
    hud.hidden = false;
    titleEl.hidden = true;
    overEl.hidden = true;
    state = 'play';
    flap();
  }

  function flap() {
    berry.vy = BOOST;
    berry.flame = 0.16;
    sfx.boost();
    for (var i = 0; i < 5; i++) {
      particles.push({
        x: berry.x + 4 + Math.random() * 8, y: berry.y + BERRY + 2,
        vx: -30 - Math.random() * 30, vy: 40 + Math.random() * 50,
        life: 0.22 + Math.random() * 0.2,
        c: i % 2 ? '#ffe66d' : '#ff9a3c'
      });
    }
  }

  function hit() {
    sfx.crash();
    shake = 0.25; flash = 0.08;
    berry.flame = 0;
    if (berry.y + BERRY >= GROUND) { berry.y = GROUND - BERRY; gameOver(); }
    else { state = 'dying'; berry.vy = -110; }
  }

  function gameOver() {
    state = 'over';
    overAt = performance.now();
    hud.hidden = true;
    finalEl.textContent = String(score);
    var finalScore = score;
    Scores.load().then(function (list) {
      var qualifies = finalScore > 0 &&
        (list.length < BOARD_SIZE || finalScore > list[list.length - 1].score);
      overEl.hidden = false;
      noteEl.hidden = true;
      if (qualifies) {
        entry.hidden = false;
        boardEl.hidden = true;
        retryBtn.hidden = true;
        initials.value = cleanName(Store.get('jettyStrawbz.initials'));
        setTimeout(function () { try { initials.focus(); initials.select(); } catch (e) {} }, 350);
      } else {
        entry.hidden = true;
        boardEl.hidden = false;
        retryBtn.hidden = false;
        renderBoard(boardEl, list, BOARD_SIZE, 0);
      }
    });
  }

  entry.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = cleanName(initials.value) || 'AAA';
    Store.set('jettyStrawbz.initials', name);
    initials.blur();
    Scores.add(name, score).then(function (res) {
      sfx.save();
      entry.hidden = true;
      boardEl.hidden = false;
      retryBtn.hidden = false;
      noteEl.hidden = res.saved;
      renderBoard(boardEl, res.list, BOARD_SIZE, res.at);
      renderBoard(titleBoard, res.list, 3, 0);
      overAt = performance.now();
    });
  });
  initials.addEventListener('input', function () { initials.value = cleanName(initials.value); });
  retryBtn.addEventListener('click', function () { start(); });

  /* ===============================================================
     CONTROLS  (tap, click, space bar, or up arrow)
  ================================================================ */
  function press() {
    if (state === 'title') start();
    else if (state === 'play') flap();
  }
  stage.addEventListener('pointerdown', function (e) {
    if (e.target.closest && e.target.closest('button, input, a, .over')) return;
    e.preventDefault();
    press();
  });
  window.addEventListener('keydown', function (e) {
    if (e.target && e.target.tagName === 'INPUT') return;
    var jump = e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW';
    if (state === 'over') {
      if ((jump || e.code === 'Enter') && !retryBtn.hidden && performance.now() - overAt > 500) {
        e.preventDefault();
        start();
      }
      return;
    }
    if (jump) {
      e.preventDefault();
      if (!e.repeat) press();
    }
  });

  /* ===============================================================
     UPDATE
  ================================================================ */
  function update(dt) {
    clock += dt;
    if (shake > 0) shake -= dt;
    if (flash > 0) flash -= dt;
    if (berry.flame > 0) berry.flame -= dt;

    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    clouds.forEach(function (c) {
      c.x -= 5 * dt;
      if (c.x < -c.w - 4) c.x = W + 10;
    });

    if (state === 'title') {
      scroll += SPEED * dt;
      berry.y = 104 + Math.sin(clock * 4) * 4;
      return;
    }

    if (state === 'dying') {
      berry.vy = Math.min(320, berry.vy + GRAVITY * dt);
      berry.y += berry.vy * dt;
      if (berry.y + BERRY >= GROUND) { berry.y = GROUND - BERRY; gameOver(); }
      return;
    }

    if (state !== 'play') return;

    var sp = speedNow();
    scroll += sp * dt;

    berry.vy = Math.min(320, berry.vy + GRAVITY * dt);
    berry.y += berry.vy * dt;
    if (berry.y < 0) { berry.y = 0; berry.vy = 0; }

    toNextPipe -= sp * dt;
    if (toNextPipe <= 0) {
      var g = gapNow();
      var top = 28 + Math.random() * (GROUND - 56 - g);
      pipes.push({ x: W, top: Math.round(top), gap: g, passed: false });
      toNextPipe += SPACING;
    }

    // forgiving hit box, a bit smaller than the drawing
    var bx1 = berry.x + 3, bx2 = berry.x + 13, by1 = berry.y + 2, by2 = berry.y + 15;

    for (var j = pipes.length - 1; j >= 0; j--) {
      var pp = pipes[j];
      pp.x -= sp * dt;
      if (pp.x + PIPE_W < -2) { pipes.splice(j, 1); continue; }
      if (!pp.passed && pp.x + PIPE_W < berry.x) {
        pp.passed = true;
        score++;
        hud.textContent = String(score);
        sfx.point();
      }
      if (bx2 > pp.x && bx1 < pp.x + PIPE_W && (by1 < pp.top || by2 > pp.top + pp.gap)) {
        hit();
        return;
      }
    }
    if (berry.y + BERRY >= GROUND) hit();
  }

  /* ===============================================================
     DRAW
  ================================================================ */
  function hills(offset, color, base, a1, f1, a2, f2) {
    ctx.fillStyle = color;
    for (var x = 0; x < W; x++) {
      var wx = x + offset;
      var h = Math.floor(base + Math.sin(wx * f1) * a1 + Math.sin(wx * f2 + 1.7) * a2);
      ctx.fillRect(x, GROUND - h, 1, h);
    }
  }

  function pipePart(x, y, w, h) {
    if (h <= 0) return;
    ctx.fillStyle = '#1d0b2e'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#22d3c5'; ctx.fillRect(x + 1, y, w - 2, h);
    ctx.fillStyle = '#8ff5ea'; ctx.fillRect(x + 3, y, 2, h);
    ctx.fillStyle = '#0e8f8a'; ctx.fillRect(x + w - 5, y, 4, h);
  }
  function pipeCap(x, y, w) {
    ctx.fillStyle = '#1d0b2e'; ctx.fillRect(x, y, w, 8);
    ctx.fillStyle = '#22d3c5'; ctx.fillRect(x + 1, y + 1, w - 2, 6);
    ctx.fillStyle = '#8ff5ea'; ctx.fillRect(x + 3, y + 1, 2, 6);
    ctx.fillStyle = '#0e8f8a'; ctx.fillRect(x + w - 5, y + 1, 4, 6);
    ctx.fillStyle = '#ff8fb8'; ctx.fillRect(x + 1, y + 3, w - 2, 1);
  }
  function drawPipe(p) {
    var x = Math.round(p.x), bottom = p.top + p.gap;
    pipePart(x + 2, 0, PIPE_W - 4, p.top - 8);
    pipeCap(x, p.top - 8, PIPE_W);
    pipeCap(x, bottom, PIPE_W);
    pipePart(x + 2, bottom + 8, PIPE_W - 4, GROUND - bottom - 8);
  }

  function drawGround() {
    ctx.fillStyle = '#3a1766'; ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = '#1d0b2e'; ctx.fillRect(0, GROUND, W, 1);
    ctx.fillStyle = '#22d3c5'; ctx.fillRect(0, GROUND + 1, W, 5);
    ctx.fillStyle = '#8ff5ea'; ctx.fillRect(0, GROUND + 1, W, 1);
    ctx.fillStyle = '#0e8f8a';
    var off = Math.floor(scroll) % 8;
    for (var x = -8; x < W + 8; x += 8) ctx.fillRect(x - off + 8, GROUND + 3, 4, 3);
    ctx.fillStyle = '#1d0b2e'; ctx.fillRect(0, GROUND + 6, W, 1);
    ctx.fillStyle = '#5b2a86';
    var off2 = Math.floor(scroll) % 12;
    for (var x2 = -12; x2 < W + 12; x2 += 12) {
      ctx.fillRect(x2 - off2 + 12, GROUND + 10, 2, 2);
      ctx.fillRect(x2 - off2 + 18, GROUND + 17, 2, 2);
    }
  }

  function drawFlames(x, y, big) {
    var f = Math.floor(clock * 30) % 2;
    var len = big ? 6 + f * 2 : 2 + f;
    [4, 9].forEach(function (ox) {
      ctx.fillStyle = '#ff9a3c'; ctx.fillRect(x + ox, y + BERRY, 4, len);
      ctx.fillStyle = '#ffe66d'; ctx.fillRect(x + ox + 1, y + BERRY, 2, Math.max(1, len - 2));
      if (big) { ctx.fillStyle = '#ff5c3c'; ctx.fillRect(x + ox + 1, y + BERRY + len, 2, 1 + f); }
    });
  }

  function drawBerry() {
    var x = Math.round(berry.x), y = Math.round(berry.y);
    if (state === 'dying' || state === 'over') {
      ctx.save();
      ctx.translate(x + 8, y + 8);
      ctx.rotate(Math.PI / 2);
      ctx.drawImage(sprite, -8, -8);
      ctx.restore();
    } else {
      drawFlames(x, y, berry.flame > 0);
      ctx.drawImage(sprite, x, y);
    }
  }

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#1d0b2e';
    ctx.fillRect(0, 0, W, H);
    if (shake > 0 && !reducedMotion) {
      ctx.translate(Math.round((Math.random() - 0.5) * 4), Math.round((Math.random() - 0.5) * 4));
    }
    ctx.drawImage(sky, 0, 0);

    stars.forEach(function (s) {
      if (Math.sin(clock * s.sp + s.ph) > -0.4) { ctx.fillStyle = s.c; ctx.fillRect(s.x, s.y, 1, 1); }
    });

    ctx.fillStyle = '#ffc2dd';
    clouds.forEach(function (c) {
      var cx = Math.round(c.x);
      ctx.fillRect(cx, c.y, c.w, 4);
      ctx.fillRect(cx + 3, c.y - 3, c.w - 9, 3);
      ctx.fillRect(cx + 6, c.y - 5, Math.max(2, c.w - 16), 2);
    });

    hills(scroll * 0.15, '#5a2390', 34, 9, 0.045, 12, 0.017);
    hills(scroll * 0.35 + 40, '#3f1870', 18, 6, 0.07, 8, 0.027);

    pipes.forEach(drawPipe);
    drawGround();

    particles.forEach(function (p) {
      ctx.fillStyle = p.c;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2);
    });

    drawBerry();

    if (flash > 0 && !reducedMotion) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.fillRect(0, 0, W, H);
    }
  }

  /* ===============================================================
     MAIN LOOP  (fixed time step so it plays the same on any screen)
  ================================================================ */
  var STEP = 1 / 120, acc = 0, last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    acc += dt;
    while (acc >= STEP) { update(STEP); acc -= STEP; }
    draw();
    requestAnimationFrame(frame);
  }

  Scores.load().then(function (list) { renderBoard(titleBoard, list, 3, 0); });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
