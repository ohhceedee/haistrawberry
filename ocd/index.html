<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#120a10">
<title>Clarice and Ocavil</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap">
<style>
:root{--bg:#120a10;--ink:#fff4f8;--accent:#F07AB2;--display:"Young Serif",Georgia,"Times New Roman",serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--display)}
#stage{position:fixed;inset:0;overflow:hidden;background:var(--bg)}

/* ---- scenes ---- */
.scene{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;pointer-events:none}
.scene.on{opacity:1}
.bg{position:absolute;inset:-8%;background-size:cover;background-position:center;filter:blur(28px) brightness(.5) saturate(1.15);transform:scale(1.1)}
.frame{position:absolute;inset:0;display:grid;place-items:center;padding:max(22px,env(safe-area-inset-top)) 18px calc(118px + env(safe-area-inset-bottom))}
.ph{display:block;max-width:calc(100vw - 36px);max-height:calc(100vh - 150px);max-height:calc(100dvh - 150px);border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.55);will-change:transform}
.solo .ph{animation:kb var(--dur,3s) ease-out both}
.solo.alt .ph{animation-name:kb2}
@keyframes kb{from{transform:scale(1.02) translateY(1.2%)}to{transform:scale(1.11) translateY(-1.2%)}}
@keyframes kb2{from{transform:scale(1.11) translateX(-1.2%)}to{transform:scale(1.02) translateX(1.2%)}}

/* fanned stack of 2-3 photos that drop in one after another */
.fan .frame{display:block}
.fan .card{position:absolute;left:50%;top:calc(50% - 46px);width:min(62vw,52vh,480px);opacity:0;
  transform:translate(calc(-50% + var(--dx)*1.6),calc(-50% + var(--dy) - 40px)) rotate(calc(var(--r)*2)) scale(1.12);
  transition:transform .85s cubic-bezier(.2,.8,.2,1),opacity .5s ease}
.fan .card.wide{width:min(84vw,62vh,600px)}
.fan .card.in{opacity:1;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r)) scale(1)}
.fan .card img{display:block;width:100%;border-radius:10px;border:5px solid #fff8fb;box-shadow:0 18px 50px rgba(0,0,0,.6)}

/* ---- title ---- */
.names{font-weight:400;margin:0;text-align:center;line-height:1.05;letter-spacing:-.01em;text-wrap:balance;
  font-size:clamp(2.3rem,9vw,5.2rem);text-shadow:0 2px 30px rgba(0,0,0,.65)}
.names i{font-style:normal;color:var(--accent);font-size:.6em;display:block;margin:.12em 0}
#intro,#title{display:grid;place-items:center;align-content:center;gap:34px;padding:24px;
  background:radial-gradient(120% 90% at 50% 40%,#3a1830 0%,#120a10 70%)}
#intro{pointer-events:auto}
#title .names{animation:rise 2.6s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.play{width:84px;height:84px;border-radius:50%;border:2px solid var(--accent);background:rgba(240,122,178,.14);color:var(--accent);
  display:grid;place-items:center;cursor:pointer;transition:transform .2s,background .2s;animation:pulse 2.4s ease-in-out infinite}
.play:hover{transform:scale(1.06);background:rgba(240,122,178,.26)}
.play:focus-visible,.again:focus-visible{outline:3px solid #fff;outline-offset:4px}
.play svg{width:30px;height:30px;margin-left:5px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,122,178,.45)}50%{box-shadow:0 0 0 18px rgba(240,122,178,0)}}

/* ---- closing collage ---- */
#end{pointer-events:none}
.grid{position:absolute;inset:0;display:grid;gap:3px;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,1fr)}
@media (min-aspect-ratio:1/1){.grid{grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(3,1fr)}}
.tile{overflow:hidden;opacity:0;transform:scale(.86);transition:opacity .7s ease,transform 1s cubic-bezier(.2,.8,.2,1)}
.tile.in{opacity:1;transform:none}
.tile img{width:100%;height:100%;object-fit:cover;display:block;animation:drift 14s ease-in-out infinite alternate}
.tile:nth-child(odd) img{animation-direction:alternate-reverse}
.tile.extra{display:none}
@media (min-aspect-ratio:1/1){.tile.extra{display:block}}
@keyframes drift{from{transform:scale(1.04)}to{transform:scale(1.16)}}
.veil{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:26px;padding:24px 24px 120px;opacity:0;transition:opacity 1.6s ease;
  background:radial-gradient(70% 50% at 50% 46%,rgba(18,10,16,.86) 0%,rgba(18,10,16,.55) 60%,rgba(18,10,16,.3) 100%)}
.veil.in{opacity:1}
.again{pointer-events:auto;width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);background:rgba(0,0,0,.35);color:#fff;display:grid;place-items:center;cursor:pointer}
.again svg{width:20px;height:20px}

/* ---- Spotify player ---- */
#dock{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(440px,calc(100vw - 24px));z-index:20;
  opacity:0;transition:opacity .8s ease;pointer-events:none}
#dock.show{opacity:1;pointer-events:auto}
#dock iframe{display:block;border-radius:12px}
#hint{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:21;font:500 .8rem/1 system-ui,sans-serif;
  background:var(--accent);color:#1E0B15;padding:8px 12px;border-radius:999px;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
#hint.show{opacity:1}

@media (prefers-reduced-motion:reduce){
  .solo .ph,.tile img,.play,#title .names{animation:none}
  .fan .card{transition:opacity .5s ease;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r))}
  .tile{transform:none}
}
</style>
</head>
<body>
<div id="stage">
  <section id="intro" class="scene on">
    <h1 class="names">Clarice <i>and</i> Ocavil</h1>
    <button class="play" id="play" aria-label="Play"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg></button>
  </section>
</div>
<div id="hint" aria-hidden="true">tap play for the song ↓</div>
<div id="dock"><div id="sp"></div></div>

<script>
(function () {
  var TRACK = 'spotify:track:6XIzOJWgi4JGCcPUskVu3J';   // Electric, Alina Baraz
  var N = 20, SOLO = 2300, FAN = 2900, TITLE = 2800;
  function src(n) { return (n < 10 ? '0' : '') + n + '.jpg'; }

  /* The film: 's' = one photo, 'f' = a fanned stack. Numbers are photo files 01-20. */
  var FILM = [
    ['s', 1], ['f', 2, 3], ['s', 4], ['f', 5, 6, 7], ['f', 8, 9], ['s', 10], ['f', 11, 12],
    ['s', 13], ['f', 14, 15, 16], ['s', 17], ['s', 18], ['f', 19, 20]
  ];
  var WIDE = { 8: 1, 9: 1, 17: 1 };
  var POSE = { 2: [[-16, -3, -5], [16, 4, 4]], 3: [[-24, 3, -7], [0, -5, 2], [24, 4, 7]] };

  var stage = document.getElementById('stage'), intro = document.getElementById('intro');
  var dock = document.getElementById('dock'), hint = document.getElementById('hint');
  var timers = [], running = false, ctrl = null, playing = false;
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function clearAll() { timers.forEach(clearTimeout); timers = []; }
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; return e; }

  // warm the cache so the film never shows a half-loaded photo
  for (var i = 1; i <= N; i++) { var im = new Image(); im.src = src(i); }

  function show(scene, ms) {
    stage.appendChild(scene);
    void scene.offsetWidth; scene.classList.add('on');
    var prev = scene.previousElementSibling;
    while (prev) { (function (p) { p.classList.remove('on'); if (p !== intro) setTimeout(function () { p.remove(); }, 1000); })(prev); prev = prev.previousElementSibling; }
    return ms;
  }

  function solo(n, alt) {
    var s = el('section', 'scene solo' + (alt ? ' alt' : ''));
    s.style.setProperty('--dur', (SOLO + 1000) + 'ms');
    s.innerHTML = '<div class="bg" style="background-image:url(' + src(n) + ')"></div><div class="frame"><img class="ph" alt="" src="' + src(n) + '"></div>';
    return show(s, SOLO);
  }

  function fan(ids) {
    var s = el('section', 'scene fan');
    var vmin = Math.min(window.innerWidth, window.innerHeight) / 100, spread = window.innerWidth > window.innerHeight ? 1.5 : 1;
    var html = '<div class="bg" style="background-image:url(' + src(ids[0]) + ')"></div><div class="frame">';
    ids.forEach(function (n, k) {
      var p = POSE[ids.length][k];
      html += '<div class="card' + (WIDE[n] ? ' wide' : '') + '" style="--dx:' + (p[0] * vmin * spread).toFixed(0) + 'px;--dy:' + (p[1] * vmin).toFixed(0) + 'px;--r:' + p[2] + 'deg"><img alt="" src="' + src(n) + '"></div>';
    });
    s.innerHTML = html + '</div>';
    show(s);
    Array.prototype.forEach.call(s.querySelectorAll('.card'), function (c, k) { later(function () { c.classList.add('in'); }, 150 + k * 620); });
    return FAN + (ids.length - 2) * 500;
  }

  function title() {
    var s = el('section', 'scene', '<h1 class="names">Clarice <i>and</i> Ocavil</h1>'); s.id = 'title';
    return show(s, TITLE);
  }

  function ending() {
    var s = el('section', 'scene'); s.id = 'end';
    var order = [], i; for (i = 1; i <= N; i++) order.push(i);
    order.sort(function (a, b) { return ((a * 7) % N) - ((b * 7) % N); });   // mixed, but the same every time
    var html = '<div class="grid">';
    order.forEach(function (n) { html += '<div class="tile"><img alt="" src="' + src(n) + '"></div>'; });
    html += '<div class="tile extra"><img alt="" src="' + src(1) + '"></div></div>';
    html += '<div class="veil"><h1 class="names">Clarice <i>and</i> Ocavil</h1><button class="again" aria-label="Play again"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button></div>';
    s.innerHTML = html; show(s); s.style.pointerEvents = 'auto';
    Array.prototype.forEach.call(s.querySelectorAll('.tile'), function (t, k) { later(function () { t.classList.add('in'); }, 120 + k * 110); });
    later(function () { s.querySelector('.veil').classList.add('in'); }, 1900);
    s.querySelector('.again').addEventListener('click', start);
    running = false;
  }

  function start() {
    if (running) return; running = true; clearAll();
    dock.classList.add('show');
    startSong();
    var t = title(), k = 0;
    FILM.forEach(function (step) {
      (function (step, at, alt) {
        later(function () { step[0] === 's' ? solo(step[1], alt) : fan(step.slice(1)); }, at);
      })(step, t, (k++) % 2);
      t += step[0] === 's' ? SOLO : FAN + (step.length - 3) * 500;
    });
    later(ending, t);
  }

  /* ---- song: Spotify's own embedded player, streamed from Spotify ---- */
  function startSong() {
    hint.classList.remove('show');
    if (!ctrl) { later(function () { if (!playing) hint.classList.add('show'); }, 2200); return; }
    try { ctrl.restart ? ctrl.restart() : (ctrl.seek(0), ctrl.play()); ctrl.play(); } catch (e) {}
    later(function () { if (!playing) hint.classList.add('show'); }, 2600);
  }
  window.onSpotifyIframeApiReady = function (API) {
    API.createController(document.getElementById('sp'), { uri: TRACK, width: '100%', height: 80 }, function (c) {
      ctrl = c;
      c.addListener('playback_update', function (e) {
        playing = !!(e && e.data && !e.data.isPaused);
        if (playing) hint.classList.remove('show');
      });
    });
  };
  var api = document.createElement('script'); api.src = 'https://open.spotify.com/embed/iframe-api/v1'; api.async = true; document.body.appendChild(api);

  document.getElementById('play').addEventListener('click', start);
})();
</script>
</body>
</html>
